# Workspace rustfmt configuration. Kept deliberately close to the ecosystem
# defaults (see sibling repos); `cargo fmt --check` runs in CI.
edition = "2021"
max_width = 100
tab_spaces = 4
newline_style = "Auto"
use_field_init_shorthand = true
imports_granularity = "Crate"
group_imports = "StdExternalCrate"
