# kind cluster configuration for tpt-chrysalis Helm testing
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: tpt-chrysalis
networking:
  # Disable default CNI to use kindnet
  disableDefaultCNI: false
  # Pod subnet (default: 10.244.0.0/16)
  podSubnet: "10.244.0.0/16"
  # Service subnet (default: 10.96.0.0/12)
  serviceSubnet: "10.96.0.0/12"
  # API server address
  apiServerAddress: "127.0.0.1"
  apiServerPort: 6443
nodes:
  # Control plane node with extra port mappings for ingress
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
      - containerPort: 30000
        hostPort: 30000
        protocol: TCP
      - containerPort: 30001
        hostPort: 30001
        protocol: TCP
  # Worker nodes for multi-replica testing
  - role: worker
  - role: worker
  - role: worker
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry.mirrors."ghcr.io"]
      endpoint = ["https://ghcr.io"]
    [plugins."io.containerd.grpc.v1.cri".registry.mirrors."docker.io"]
      endpoint = ["https://registry-1.docker.io"]