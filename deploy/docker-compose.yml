# tpt-chrysalis Docker Compose - Phase 1 Stack
# Dual deployment parity with Helm chart (see deploy/helm/tpt-chrysalis/)
# Run with: docker compose -f docker-compose.yml -f docker-compose.override.yml up

version: "3.9"

services:
  # tpt-archon: capability kernel + audit ledger + relational storage
  tpt-archon:
    image: ghcr.io/tpt-solutions/tpt-archon:latest
    container_name: tpt-chrysalis-archon
    environment:
      - RUST_LOG=info
      - ARCHON_KERNEL_BIND=0.0.0.0:50051
      - ARCHON_STORAGE_BIND=0.0.0.0:50052
      - ARCHON_RELATIONAL_BIND=0.0.0.0:50053
      - ARCHON_WAL_DIR=/data/wal
      - ARCHON_DB_DIR=/data/db
      - ARCHON_CAPABILITY_ROOT_KEY_FILE=/secrets/capability_root_key
    volumes:
      - archon-wal:/data/wal
      - archon-db:/data/db
      - ./secrets:/secrets:ro
    ports:
      - "50051:50051"  # Kernel gRPC
      - "50052:50052"  # Storage gRPC
      - "50053:50053"  # Relational gRPC
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=:50051"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chrysalis-net
    restart: unless-stopped

  # MinIO: S3-compatible object storage for imaging (Phase 2+ scaffolded now)
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: tpt-chrysalis-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_PROMETHEUS_AUTH_TYPE=public
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - chrysalis-net
    restart: unless-stopped

  # API: tpt-chrysalis-api service
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    container_name: tpt-chrysalis-api
    environment:
      - RUST_LOG=info
      - API_BIND=0.0.0.0:3000
      - ARCHON_KERNEL_ENDPOINT=http://tpt-archon:50051
      - ARCHON_STORAGE_ENDPOINT=http://tpt-archon:50052
      - ARCHON_RELATIONAL_ENDPOINT=http://tpt-archon:50053
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_BUCKET=chrysalis-imaging
      - CAPABILITY_ROOT_KEY_FILE=/secrets/capability_root_key
      - DEFAULT_SCOPE=equipment/sim-liquid-handler-0
    volumes:
      - ./secrets:/secrets:ro
    ports:
      - "3000:3000"
    depends_on:
      tpt-archon:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chrysalis-net
    restart: unless-stopped

  # Frontend: Leptos + Trunk dev server (production uses static build)
  frontend:
    build:
      context: ../frontend
      dockerfile: ../deploy/Dockerfile.frontend
    container_name: tpt-chrysalis-frontend
    environment:
      - TRUNK_PORT=8080
      - API_BASE=http://api:3000/api/v1
    ports:
      - "8080:8080"
    depends_on:
      - api
    networks:
      - chrysalis-net
    restart: unless-stopped
    # Development override adds hot-reload volumes

  # Scheduled audit-chain-integrity check job (TODO.md Phase 1, line 100).
  # Loops `tpt-chrysalis-compliance integrity --watch` against the shared
  # ledger volume; exits non-zero on a broken hash chain so a failed
  # container/restart becomes the alerting trigger. Read-only mount.
  integrity-check:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.compliance
    container_name: tpt-chrysalis-integrity
    environment:
      - RUST_LOG=info
    volumes:
      - archon-wal:/data:ro
    depends_on:
      tpt-archon:
        condition: service_healthy
    networks:
      - chrysalis-net
    restart: unless-stopped

volumes:
  archon-wal:
  archon-db:
  minio-data:

networks:
  chrysalis-net:
    driver: bridge