[package]
name = "tpt-chrysalis-frontend"
version = "0.1.0"
edition = "2021"
description = "Rust/Wasm frontend for tpt-chrysalis (Leptos + Trunk)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "0.7", features = ["csr", "hydrate"] }
leptos_router = { version = "0.7" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "EventTarget", "MessageEvent", "WebSocket", "console", "HtmlCanvasElement", "CanvasRenderingContext2d"] }
gloo-net = "0.2"
gloo-timers = "0.2"
js-sys = "0.3"
tracing = "0.1"
tracing-web = "0.1"
tokio = { version = "1", features = ["sync", "rt", "macros"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[features]
default = ["csr"]
csr = []
hydrate = []

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"